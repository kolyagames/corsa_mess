name: Android

# Сборка Android-версии corsa-mess. Запускается на инфраструктуре GitHub, где уже есть Android SDK —
# локально у разработчиков его может не быть, а скачивать несколько гигабайт SDK на каждую машину не нужно.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/shared/**'
      - 'app-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/shared/**'
      - 'app-android/**'
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: app-android
        run: npm install

      - name: Build web assets from app/src
        working-directory: app-android
        run: npm run build-www

      - name: Sync Capacitor Android project
        working-directory: app-android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x app-android/android/gradlew

      - name: Build debug APK
        working-directory: app-android/android
        shell: bash
        # `tee` по себе маскирует код возврата gradle — без pipefail шаг считался бы успешным
        # (echo $? показал бы код tee, а не gradle), даже если сама сборка упала.
        run: set -o pipefail; ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      # Лог-файлы сборки раздаются с серверов, до которых у среды разработки нет сетевого доступа
      # (та же причина, по которой Android-сборка вообще делается здесь, а не локально) — поэтому
      # при ошибке конец лога печатается ещё и как аннотация (::error::), её видно через `gh run view`
      # без скачивания логов. Аннотации режутся по размеру, поэтому это несколько кусков помельче.
      - name: Post build log on failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          try:
              data = open('app-android/android/gradle.log', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              data = '(gradle.log не найден)'

          # "--stacktrace" печатает в конце огромный java-стектрейс служебных классов Gradle — он не
          # интересен. Важная часть — секция "What went wrong" (есть почти всегда) плюс отдельные строки
          # с настоящей причиной (ошибки компиляции Kotlin/javac, "Caused by", "> Task ... FAILED").
          wrong = re.search(r'\* What went wrong:.*?(?=\n\* (?:Try|Get more help|Exception is)|\Z)', data, re.S)
          lines = [l for l in data.splitlines() if re.search(r'^e: |error:|Caused by:|FAILED$|^> Task .*FAILED', l)]
          summary = (wrong.group(0).strip() if wrong else '') + '\n\n' + '\n'.join(lines[-40:])
          if not summary.strip():
              summary = data[-4000:]  # не нашли ничего узнаваемого — отдать хотя бы конец лога

          chunk = 3500
          for i in range(0, min(len(summary), chunk * 3), chunk):
              part = summary[i:i + chunk]
              part = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::gradle[{i // chunk + 1}] {part}')
          PYEOF

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: corsa-mess-android
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # На тег-релиз (тот же релиз, которым публикуется Windows-сборка) добавляем apk рядом с exe.
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app-android/android/app/build/outputs/apk/debug/app-debug.apk
